name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to release, for example 0.4.5 or 0.5.0-alpha.1'
                required: true
            dist-tag:
                description: 'npm dist-tag: latest, next for a pre-release, or e.g. release-0.4 for a hotfix of an older line'
                required: true
                default: latest
            dry-run:
                description: 'Build and check everything, but push and publish nothing'
                type: boolean
                default: false

jobs:
    build:
        if: github.ref_type == 'branch'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - run: npm ci
            - run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            - run: npm version "$VERSION" --allow-same-version --tag-version-prefix=""
              env:
                  VERSION: ${{ inputs.version }}
            - run: npm pack
            - name: Check that npm accepts the package
              run: npm publish nuget-deps-tree-*.tgz --access public --dry-run $TAG_ARG
              env:
                  TAG_ARG: ${{ inputs.dist-tag != 'latest' && format('--tag={0}', inputs.dist-tag) || '' }}
            - uses: actions/upload-artifact@v7
              with:
                  name: package
                  path: nuget-deps-tree-*.tgz
            - if: ${{ !inputs.dry-run }}
              run: git push --atomic --follow-tags
            - if: ${{ !inputs.dry-run }}
              run: gh release create "$VERSION" --generate-notes --prerelease=${{ contains(inputs.version, '-') }}
              env:
                  VERSION: ${{ inputs.version }}
                  GH_TOKEN: ${{ github.token }}

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - uses: actions/download-artifact@v8
              with:
                  name: package
            - run: npm publish nuget-deps-tree-*.tgz --access public $TAG_ARG --dry-run=${{ inputs.dry-run }}
              env:
                  TAG_ARG: ${{ inputs.dist-tag != 'latest' && format('--tag={0}', inputs.dist-tag) || '' }}
