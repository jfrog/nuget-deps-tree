name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to release, for example 0.4.5'
                required: true
            dry-run:
                description: 'Build and check everything, but push and publish nothing'
                type: boolean
                default: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - run: npm ci
            - run: git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
            - run: npm version "$VERSION" --allow-same-version --tag-version-prefix=""
              env:
                  VERSION: ${{ inputs.version }}
            - run: npm pack
            - name: Check that npm accepts the package
              run: npm publish nuget-deps-tree-*.tgz --access public --dry-run
            - uses: actions/upload-artifact@v7
              with:
                  name: package
                  path: nuget-deps-tree-*.tgz
            - if: ${{ !inputs.dry-run }}
              run: git push --atomic --follow-tags
            - if: ${{ !inputs.dry-run }}
              run: gh release create "$(git describe --tags --exact-match)" --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - uses: actions/download-artifact@v8
              with:
                  name: package
            - run: npm publish nuget-deps-tree-*.tgz --access public --dry-run=${{ inputs.dry-run }}
