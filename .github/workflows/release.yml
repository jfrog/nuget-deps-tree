name: Release

on:
    release:
        types: [published]
jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v1

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                node-version: '24'

            - name: Install
              run: npm i
            - name: Update version
              run: echo ${{ github.ref }} | cut -c 11- | xargs npm version --no-git-tag-version --allow-same-version
            - name: Push changes
              uses: ad-m/github-push-action@master
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
            - name: Pack
              run: npm pack
            - name: Upload package
              uses: actions/upload-artifact@v4
              with:
                  name: package
                  path: nuget-deps-tree-*.tgz
                  if-no-files-found: error

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                node-version: '24'
                registry-url: 'https://registry.npmjs.org'

            - name: Download package
              uses: actions/download-artifact@v4
              with:
                  name: package
            - name: Publish
              run: npm publish nuget-deps-tree-*.tgz --access public
